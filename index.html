<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codespaces Rails</title>
    <meta name="description" content="A Rails 7.1 API + React frontend starter template, deployable to Render, Railway, GitHub Pages, and Vercel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
:root{--bg:#0a0e1a;--bg-card:#111827;--bg-card-hover:#1a2332;--border:#1e2a3a;--text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b;--accent:#06b6d4;--accent-dim:#0891b2;--success:#10b981;--warning:#f59e0b;--error:#ef4444;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.hero{position:relative;overflow:hidden;padding:6rem 2rem 4rem;text-align:center}
.hero::before{content:"";position:absolute;top:-50%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(6,182,212,.12) 0%,transparent 70%);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1rem;background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.25);border-radius:999px;font-size:.85rem;color:var(--accent);font-weight:500;margin-bottom:1.5rem;position:relative}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.hero h1{font-size:clamp(2.5rem,6vw,4rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:1.25rem;position:relative;background:linear-gradient(135deg,#e2e8f0 0%,#06b6d4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:1.2rem;color:var(--text-muted);max-width:600px;margin:0 auto 2rem;position:relative}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;position:relative}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.75rem;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:all .2s ease}
.btn-primary{background:var(--accent);color:#0a0e1a}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-2px);box-shadow:0 8px 24px rgba(6,182,212,.3)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.section{max-width:1100px;margin:0 auto;padding:3rem 2rem}
.section-title{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.5rem}
.section-subtitle{color:var(--text-muted);margin-bottom:2.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;transition:all .25s ease}
.card:hover{background:var(--bg-card-hover);border-color:rgba(6,182,212,.3);transform:translateY(-4px)}
.card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:1.25rem;background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.2)}
.card h3{font-size:1.2rem;font-weight:600;margin-bottom:.5rem}
.card p{color:var(--text-muted);font-size:.95rem}
.card code{display:inline-block;margin-top:.75rem;padding:.3rem .6rem;background:rgba(0,0,0,.3);border-radius:6px;font-size:.85rem;color:var(--accent);font-family:SF Mono,Fira Code,monospace}
.status-bar{max-width:1100px;margin:0 auto;padding:0 2rem 3rem}
.status-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}
.status-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.status-header h3{font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:.75rem}
.status-indicator{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.status-indicator.ok{background:var(--success);box-shadow:0 0 12px rgba(16,185,129,.5)}
.status-indicator.loading{background:var(--warning);animation:pulse 1s ease-in-out infinite}
.status-indicator.error{background:var(--error)}
.status-data{background:rgba(0,0,0,.3);border-radius:var(--radius-sm);padding:1.25rem;font-family:SF Mono,Fira Code,monospace;font-size:.9rem;line-height:1.7;overflow-x:auto}
.status-data .key{color:var(--text-dim)}
.status-data .value{color:var(--accent)}
.status-data .error-text{color:var(--error)}
.status-loading{color:var(--text-dim);font-style:italic}
.stack-list{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.tag{padding:.35rem .85rem;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2);border-radius:999px;font-size:.85rem;color:var(--accent);font-weight:500}
footer{text-align:center;padding:3rem 2rem;color:var(--text-dim);font-size:.9rem;border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:640px){.hero{padding:4rem 1.5rem 3rem}.section{padding:2rem 1.5rem}.status-bar{padding:0 1.5rem 2rem}.hero-actions{flex-direction:column;align-items:center}.btn{width:100%;justify-content:center}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
const { useState, useEffect } = React;
const API_BASE = "http://localhost:3000";

async function fetchHealth() {
  const res = await fetch(API_BASE + "/api/v1/health");
  if (!res.ok) throw new Error("API error: " + res.status);
  return res.json();
}

  return ({ ruby: "💎", react: "⚛", docker: "🐳", render: "▲", railway: "🚂", pages: "📄" })[name] || "📦";
}

  }, []);

    { icon: "docker", label: "Docker Ready", desc: "Multi-platform Dockerfile with bundler caching for fast container builds.", tag: "Dockerfile" },
    { icon: "render", label: "Render Blueprint", desc: "One-click deploy via render.yaml with managed Postgres included.", tag: "render.yaml" },
    { icon: "railway", label: "Railway Config", desc: "Pre-configured railway.json for instant deployment with Postgres plugin.", tag: "railway.json" },
    { icon: "pages", label: "GitHub Pages CI", desc: "Automated build and deploy workflow for the frontend on every push.", tag: "Actions" }
  ];
  const stack = ["Rails 7.1","Ruby 3.3","PostgreSQL","React 18","TypeScript","Vite 5","Docker","Puma"];

  return React.createElement(React.Fragment, null,
    React.createElement("section", { className: "hero" },
      React.createElement("div", { className: "hero-badge" },
        React.createElement("span", { className: "dot" }), "Open Source Starter"
      ),
      React.createElement("h1", null, "Codespaces Rails"),
      React.createElement("p", null, "A production-ready Rails 7.1 API with a React + TypeScript frontend. Deploy the backend to Render or Railway, and the frontend to GitHub Pages or Vercel — all from one monorepo."),
      React.createElement("div", { className: "hero-actions" },
        React.createElement("a", { className: "btn btn-primary", href: "https://github.com/Rintu-chowdory/codespaces-rails", target: "_blank", rel: "noopener noreferrer" }, "View on GitHub"),
        React.createElement("a", { className: "btn btn-secondary", href: "#features" }, "Explore Features")
      )
    ),
    React.createElement("section", { className: "section", id: "features" },
      React.createElement("h2", { className: "section-title" }, "What's Included"),
      React.createElement("p", { className: "section-subtitle" }, "Everything you need to ship a full-stack app, preconfigured and ready to deploy."),
      React.createElement("div", { className: "grid" },
        features.map(f => React.createElement("div", { className: "card", key: f.label },
          React.createElement("div", { className: "card-icon" }, iconFor(f.icon)),
          React.createElement("h3", null, f.label),
          React.createElement("p", null, f.desc),
          React.createElement("code", null, f.tag)
        ))
      )
    ),
    React.createElement("section", { className: "status-bar" },
      React.createElement("div", { className: "status-card" },
        React.createElement("div", { className: "status-header" },
          React.createElement("h3", null,
            React.createElement("span", { className: "status-indicator " + status }), "API Health Check"
          ),
          React.createElement("span", { style: { color: "var(--text-dim)", fontSize: "0.9rem" } }, "GET /api/v1/health")
        ),
        React.createElement("div", { className: "status-data" },
          status === "loading" && React.createElement("div", { className: "status-loading" }, "Checking API status…"),
          status === "error" && React.createElement("div", null,
            React.createElement("span", { className: "key" }, "status:"), " ",
            React.createElement("span", { className: "value" }, "unreachable"), "\n",
            React.createElement("span", { className: "key" }, "error:"), " ",
            React.createElement("span", { className: "error-text" }, error), "\n",
            React.createElement("span", { className: "key" }, "hint:"), " ",
            React.createElement("span", { style: { color: "var(--text-dim)" } }, "Start the Rails API with `bin/rails s` from the api/ directory")
          ),
          status === "ok" && health && React.createElement("div", null,
            React.createElement("span", { className: "key" }, "status:"), " ",
            React.createElement("span", { className: "value" }, health.status), "\n",
            React.createElement("span", { className: "key" }, "environment:"), " ",
            React.createElement("span", { className: "value" }, health.environment), "\n",
            React.createElement("span", { className: "key" }, "timestamp:"), " ",
            React.createElement("span", { className: "value" }, health.timestamp)
          )
        )
      )
    ),
    React.createElement("section", { className: "section" },
      React.createElement("h2", { className: "section-title" }, "Tech Stack"),
      React.createElement("p", { className: "section-subtitle" }, "Modern, battle-tested technologies that scale."),
      React.createElement("div", { className: "stack-list" },
        stack.map(s => React.createElement("span", { className: "tag", key: s }, s))

    ),
    React.createElement("footer", null,
      React.createElement("p", null, "Built by ",
        React.createElement("a", { href: "https://github.com/Rintu-chowdory", target: "_blank", rel: "noopener noreferrer" }, "Rintu-chowdory"),
        " — open source and free to use."
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
    </script>
  </body>
</html>
